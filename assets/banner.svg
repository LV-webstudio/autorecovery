<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Shania Autorecovery">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191b20"/>
      <stop offset="0.55" stop-color="#101216"/>
      <stop offset="1" stop-color="#0a0b0e"/>
    </linearGradient>
    <linearGradient id="bgold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe7a6"/>
      <stop offset="0.45" stop-color="#e9b94b"/>
      <stop offset="1" stop-color="#b8841f"/>
    </linearGradient>
    <linearGradient id="bglass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="bblur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>

  <rect width="1280" height="400" fill="url(#bbg)"/>
  <!-- rejilla sutil -->
  <g stroke="#ffffff" stroke-opacity="0.035">
    <path d="M0 100 H1280 M0 200 H1280 M0 300 H1280"/>
    <path d="M160 0 V400 M360 0 V400 M560 0 V400 M760 0 V400 M960 0 V400 M1160 0 V400"/>
  </g>
  <circle cx="300" cy="200" r="170" fill="url(#bgold)" opacity="0.16" filter="url(#bblur)"/>

  <!-- baldosa de cristal inclinada (3D) -->
  <g transform="translate(300,200) rotate(-21) skewX(-7)">
    <rect x="-112" y="-112" width="224" height="224" rx="48" fill="url(#bglass)" stroke="url(#bgold)" stroke-width="2.5" stroke-opacity="0.85"/>
    <rect x="-112" y="-112" width="224" height="104" rx="48" fill="#ffffff" opacity="0.10"/>
  </g>
  <!-- emblema RECTO y limpio -->
  <g transform="translate(300,200)">
    <g fill="none" stroke="url(#bgold)" stroke-linecap="round">
      <path d="M -56 -50 A 78 78 0 0 1 56 -50" stroke-width="10" opacity="0.35"/>
      <path d="M -34 -36 A 48 48 0 0 1 34 -36" stroke-width="10" opacity="0.6"/>
      <circle cx="0" cy="-17" r="6" fill="url(#bgold)" stroke="none"/>
    </g>
    <g stroke="url(#bgold)" stroke-width="15" stroke-linecap="round" fill="none">
      <path d="M 0 18 L 0 76"/>
      <path d="M -34 48 A 53 53 0 1 0 34 48"/>
    </g>
  </g>

  <!-- texto -->
  <g font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="560" y="170" font-size="72" font-weight="700" letter-spacing="2" fill="#f4f1ea">Shania Autorecovery
      <tspan font-size="26" dy="-34" fill="#f4f1ea" opacity="0.7">™</tspan>
    </text>
    <text x="560" y="222" font-size="27" font-weight="500" letter-spacing="1" fill="url(#bgold)">Despertar, gestionar y recuperar equipos a distancia</text>
    <g font-size="20" fill="#c9c6bf">
      <text x="560" y="286">Wake-on-LAN · cliente del router HGU · acceso remoto cifrado y firmado</text>
    </g>
    <g font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="18" fill="#e9b94b">
      <text x="560" y="330" opacity="0.9">$ autorecovery wake pc  →  ✓ en línea</text>
    </g>
  </g>
</svg>
