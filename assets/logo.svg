<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Shania Autorecovery">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1d22"/>
      <stop offset="1" stop-color="#0d0e11"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe7a6"/>
      <stop offset="0.45" stop-color="#e9b94b"/>
      <stop offset="1" stop-color="#b8841f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="blurbig" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="232" r="150" fill="url(#gold)" opacity="0.16" filter="url(#blurbig)"/>

  <!-- baldosa de cristal inclinada (3D) -->
  <g transform="translate(256,232) rotate(-21) skewX(-7)">
    <rect x="-130" y="-130" width="260" height="260" rx="54" fill="url(#glass)" stroke="url(#gold)" stroke-width="3" stroke-opacity="0.85"/>
    <rect x="-130" y="-130" width="260" height="120" rx="54" fill="#ffffff" opacity="0.10"/>
    <rect x="-130" y="-130" width="260" height="260" rx="54" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
  </g>

  <!-- emblema RECTO y limpio: ondas de despertar + símbolo de encendido -->
  <g transform="translate(256,232)">
    <!-- ondas de señal (WoL) -->
    <g fill="none" stroke="url(#gold)" stroke-linecap="round">
      <path d="M -66 -58 A 92 92 0 0 1 66 -58" stroke-width="12" opacity="0.35"/>
      <path d="M -40 -42 A 56 56 0 0 1 40 -42" stroke-width="12" opacity="0.6"/>
      <circle cx="0" cy="-20" r="7" fill="url(#gold)" stroke="none"/>
    </g>
    <!-- símbolo de encendido -->
    <g stroke="url(#gold)" stroke-width="17" stroke-linecap="round" fill="none" filter="url(#glow)" opacity="0.4">
      <path d="M 0 22 L 0 88"/>
      <path d="M -40 56 A 62 62 0 1 0 40 56"/>
    </g>
    <g stroke="url(#gold)" stroke-width="17" stroke-linecap="round" fill="none">
      <path d="M 0 22 L 0 88"/>
      <path d="M -40 56 A 62 62 0 1 0 40 56"/>
    </g>
  </g>

  <!-- marca -->
  <g font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="256" y="452" font-size="54" font-weight="700" letter-spacing="3" fill="#f4f1ea">SHANIA</text>
    <text x="256" y="487" font-size="23" font-weight="500" letter-spacing="8" fill="url(#gold)">AUTORECOVERY</text>
    <text x="398" y="430" font-size="18" fill="#f4f1ea" opacity="0.7">™</text>
  </g>
</svg>
